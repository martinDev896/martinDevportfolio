<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard — Martin Kimathi</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="dashboard-page">

  <!-- Navbar -->
  <nav class="admin-nav">
    <div class="admin-logo">MK Admin</div>
    <button id="logout-btn" class="logout-btn">Logout</button>
  </nav>

  <!-- Dashboard Content -->
  <div class="dashboard-inner">

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="services">
        Services
      </button>
      <button class="tab-btn" data-tab="projects">
        Projects
      </button>
      <button class="tab-btn" data-tab="messages">
        Messages
      </button>
    </div>

    <!-- ── SERVICES TAB ── -->
    <div id="tab-services" class="tab-content active">

      <div class="tab-header">
        <h2>Manage Services</h2>
        <button class="add-btn" id="add-service-btn">
          + Add Service
        </button>
      </div>

      <!-- Add/Edit Service Form -->
      <div class="form-card" id="service-form-card"
           style="display: none;">
        <h3 id="service-form-title">Add New Service</h3>
        <input type="hidden" id="service-doc-id" />
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="service-title"
                 placeholder="e.g. Web Development" />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="service-description" rows="3"
                    placeholder="Describe the service..."></textarea>
        </div>
        <div class="form-group">
          <label>Icon</label>
          <select id="service-icon">
            <option value="code">Code</option>
            <option value="layout">Layout</option>
            <option value="smartphone">Smartphone</option>
          </select>
        </div>
        <div class="form-group">
          <label>Order Number</label>
          <input type="number" id="service-order"
                 placeholder="e.g. 1" />
        </div>
        <div class="form-actions">
          <button id="save-service-btn" class="save-btn">
            Save Service
          </button>
          <button id="cancel-service-btn" class="cancel-btn">
            Cancel
          </button>
        </div>
        <p id="service-status"
           style="text-align:center;
                  margin-top:10px;
                  font-size:0.88rem;
                  min-height:20px;">
        </p>
      </div>

      <!-- Services List -->
      <div id="services-list" class="items-list">
        <p class="loading-text">Loading services...</p>
      </div>

    </div>

    <!-- ── PROJECTS TAB ── -->
    <div id="tab-projects" class="tab-content">

      <div class="tab-header">
        <h2>Manage Projects</h2>
        <button class="add-btn" id="add-project-btn">
          + Add Project
        </button>
      </div>

      <!-- Add/Edit Project Form -->
      <div class="form-card" id="project-form-card"
           style="display: none;">
        <h3 id="project-form-title">Add New Project</h3>
        <input type="hidden" id="project-doc-id" />
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="project-title"
                 placeholder="e.g. Portfolio Website" />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="project-description" rows="3"
                    placeholder="Describe the project..."></textarea>
        </div>
        <div class="form-group">
          <label>Image Path</label>
          <input type="text" id="project-image"
                 placeholder="e.g. images/project1.jpg" />
        </div>
        <div class="form-group">
          <label>Order Number</label>
          <input type="number" id="project-order"
                 placeholder="e.g. 1" />
        </div>
        <div class="form-actions">
          <button id="save-project-btn" class="save-btn">
            Save Project
          </button>
          <button id="cancel-project-btn" class="cancel-btn">
            Cancel
          </button>
        </div>
        <p id="project-status"
           style="text-align:center;
                  margin-top:10px;
                  font-size:0.88rem;
                  min-height:20px;">
        </p>
      </div>

      <!-- Projects List -->
      <div id="projects-list" class="items-list">
        <p class="loading-text">Loading projects...</p>
      </div>

    </div>

    <!-- ── MESSAGES TAB ── -->
    <div id="tab-messages" class="tab-content">
      <div class="tab-header">
        <h2>Messages</h2>
      </div>
      <div id="messages-list" class="items-list">
        <p class="loading-text">Loading messages...</p>
      </div>
    </div>

  </div>

  <!-- Firebase -->
  <script type="module" src="admin.js"></script>

</body>
</html>
