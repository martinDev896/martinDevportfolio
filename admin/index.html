<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Martin Kimathi</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="login-page">

  <!-- Login Card -->
  <div class="login-card">

    <div class="login-logo">MK</div>
    <h2>Admin Login</h2>
    <p class="login-subtitle">Martin Kimathi Portfolio</p>

    <!-- Email -->
    <div class="form-group">
      <label>Email</label>
      <input type="email"
             id="login-email"
             placeholder="your@gmail.com" />
    </div>

    <!-- Password -->
    <div class="form-group">
      <label>Password</label>
      <input type="password"
             id="login-password"
             placeholder="Your password" />
    </div>

    <!-- Error message -->
    <p id="login-error"
       style="color: red;
              font-size: 0.85rem;
              text-align: center;
              min-height: 20px;
              margin-bottom: 10px;">
    </p>

    <!-- Login Button -->
    <button id="login-btn" class="login-btn">
      Login
    </button>

  </div>

  <!-- Firebase -->
  <script type="module" src="admin.js"></script>

</body>
</html>
